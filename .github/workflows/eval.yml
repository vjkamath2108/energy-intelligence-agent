name: EIA Eval Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: ruff check
        run: ruff check src/ evaluation/

      - name: ruff format check
        run: ruff format --check src/ evaluation/

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        # Skip tests that require live AWS credentials or a PostgreSQL connection.
        # These are gated behind the `integration` marker and AWS credential
        # availability — they run in the nightly environment, not on every PR.
        run: |
          PYTHONPATH=. pytest tests/ \
            --ignore=tests/test_embeddings.py \
            --ignore=tests/test_hybrid_retriever.py \
            --ignore=tests/test_db.py \
            --ignore=tests/test_bm25.py \
            -q --tb=short

  eval-gate:
    name: Faithfulness & citation gate
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Run the golden eval set against the v1 prompt using mock (no AWS needed).
      # The gate fails if faithfulness < 80% or citation coverage < 90%.
      #
      # To verify the gate catches bad prompts locally:
      #   python evaluation/ci_gate.py --mock --prompt-version degraded  (exits 1)
      - name: Run eval gate (prompt v1, mock)
        run: PYTHONPATH=. python evaluation/ci_gate.py --mock --prompt-version v1
