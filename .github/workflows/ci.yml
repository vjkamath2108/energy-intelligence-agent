name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── 1. Lint ────────────────────────────────────────────────────────────────
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tools
        run: pip install ruff mypy pydantic langfuse boto3 httpx pyyaml scikit-learn numpy

      - name: ruff check
        run: ruff check src/ evaluation/

      - name: ruff format check
        run: ruff format --check src/ evaluation/

      - name: mypy --strict
        run: mypy --strict src/

  # ── 2. Unit tests + coverage ───────────────────────────────────────────────
  test:
    name: Unit tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt pytest-cov

      - name: Run unit tests (no AWS / no DB)
        # test_db.py is excluded — it has no unit-test tier, only integration.
        # All other previously-ignored files (embeddings, bm25, hybrid_retriever)
        # have fully-mocked unit tests and run here without any credentials.
        # -m "not integration" skips @pytest.mark.integration tests in those files.
        run: |
          PYTHONPATH=. pytest tests/ \
            --ignore=tests/test_db.py \
            -m "not integration" \
            --cov --cov-fail-under=80 \
            -q --tb=short

  # ── 3. Eval gate ───────────────────────────────────────────────────────────
  eval-gate:
    name: Faithfulness & citation gate
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run eval gate (prompt v1, mock)
        run: PYTHONPATH=. python evaluation/ci_gate.py --mock --prompt-version v1

  # ── 4. Docker build ────────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: energy-agent:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── 5. Integration tests (Bedrock + PostgreSQL) ────────────────────────────
  # Runs only on pushes to main. Requires two repository secrets:
  #   AWS_ACCOUNT_ID   — your AWS account ID
  #   AWS_ROLE_ARN     — ARN of the energy-agent-github-ci OIDC role
  #                      (created by scripts/bootstrap_cicd.sh)
  # PostgreSQL comes from a service container — no RDS instance needed.
  integration-test:
    name: Integration tests (Bedrock + PostgreSQL)
    runs-on: ubuntu-latest
    needs: [test]
    if: github.ref == 'refs/heads/main' && vars.RUN_INTEGRATION == 'true'

    permissions:
      id-token: write   # required for OIDC token exchange
      contents: read

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: energy_user
          POSTGRES_DB: energy_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: eu-west-2

      - name: Apply database schema
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U energy_user -d energy_db -c "CREATE EXTENSION IF NOT EXISTS vector;"
          psql -h localhost -U energy_user -d energy_db -f src/data_pipeline/schema.sql

      - name: Run integration tests
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_NAME: energy_db
          DB_USER: energy_user
          DB_PASSWORD: postgres
          DB_SSLMODE: disable
          AWS_REGION: eu-west-2
          LANGFUSE_ENABLED: "false"
        run: |
          PYTHONPATH=. pytest tests/ \
            -m integration \
            -v --tb=short
